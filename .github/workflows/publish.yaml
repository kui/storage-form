name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # Trusted publishing: npm exchanges the OIDC token for a short-lived
  # publish credential, so no npm token is stored as a secret.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - name: Setup mise
        uses: jdx/mise-action@v5
      - name: Check that the tag matches the package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - name: Install dependencies
        run: npm ci
      - name: Run linter
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Check the package
        run: npm run check:package
      - name: Install browser
        run: npx playwright install --with-deps --no-shell chromium
      - name: Run e2e tests
        run: npm run test:e2e
      # Staging needs a maintainer to approve it with 2FA (`npm stage approve`)
      # before it becomes public, so this job alone cannot publish.
      # Keep prereleases off the latest dist-tag, which plain installs use.
      - name: Stage the package
        run: |
          tag=$(node -p 'require("./package.json").version.includes("-") ? "next" : "latest"')
          npm stage publish --tag "$tag"
